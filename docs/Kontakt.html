<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Kontakt</h1>
      <nav>
        <ul>
          <li><a href="index.html">Główna</a></li>
          <li><a href="Galeria.html">Galeria</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <form id="contactForm" novalidate>
        <div class="form-group">
          <label for="email">Adres E-Mail:</label>
          <input type="text" id="email" placeholder="npm. jan@domena.pl" />
          <span class="error-msg" id="emailError"
            >Wprowadź poprawny adres e-mail!</span
          >
        </div>

        <div class="form-group">
          <label for="topic">Temat wiadomości:</label>
          <select id="topic">
            <option value="">-- Wybierz temat --</option>
            <option value="wspolpraca">Współpraca</option>
            <option value="pytanie">Pytanie ogólne</option>
            <option value="problem">Zgłoszenie problemu</option>
          </select>
          <span class="error-msg" id="topicError">Proszę wybrać temat!</span>
        </div>

        <div class="form-group">
          <label for="message">Wiadomość:</label>
          <textarea
            id="message"
            rows="5"
            placeholder="Napisz swoją wiadomość (min. 10 znaków)..."
          ></textarea>
          <span class="error-msg" id="messageError"
            >Wiadomość musi mieć minimum 10 znaków!</span
          >
        </div>

        <input type="submit" value="Wyślij wiadomość" />
      </form>

      <div id="successBox" class="success-box">
        Dziękujemy! Twoja wiadomość została poprawnie wysłana.
      </div>
    </main>
    <footer>
      <small>Wiktor Jabrzyk <span id="clock">00:00:00</span></small>
    </footer>
    <script src="main.js"></script>
  </body>
</html>
